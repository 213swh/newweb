<script>
async function publishNews(event) {
    event.preventDefault();
    const form = document.getElementById('news-publish-form');
    const formData = new FormData(form);
    
    try {
        // 添加完整URL和端口号
        const response = await fetch('http://localhost:5001/publish-news', {
            method: 'POST',
            body: formData
        });
        
        // 检查HTTP响应状态
        if (!response.ok) {
            throw new Error(`HTTP错误: ${response.status}`);
        }
        
        const data = await response.json();
        if (data.success) {
            alert('新闻发布成功！');
            form.reset();
        } else {
            alert('新闻发布失败：' + data.error);
        }
    } catch (error) {
        alert('请求出错：' + error.message);
    }
}
</script>
